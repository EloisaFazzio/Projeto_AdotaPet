name: AdotaPet - vitrine gratuita GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site-demo/**'
      - '.github/workflows/pages-vitrine.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar somente a vitrine estatica
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-demo
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
