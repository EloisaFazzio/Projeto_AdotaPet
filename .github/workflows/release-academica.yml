name: AdotaPet - criar marco academico v1.0.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-academica.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar-marco-academico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e validar testes Java
        run: mvn --batch-mode --no-transfer-progress test
      - name: Verificar sintaxe JavaScript
        run: |
          node --check site-demo/app.js
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/painel.js
      - name: Atualizar descricao da release academica
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/notas-academicas.md <<'NOTAS'
          ## AdotaPet — entrega acadêmica 2026

          **Site demonstrativo:** https://eloisafazzio.github.io/Projeto_AdotaPet/

          Nesta entrega, apresento o AdotaPet, projeto acadêmico de Engenharia de Software desenvolvido com Java 17, Spring Boot, JPA, API REST e interface responsiva.

          O repositório reúne o código-fonte, o painel operacional, os testes e a documentação. O site demonstrativo usa dados fictícios; para executar o backend completo, disponibilizo as instruções de instalação local no README.

          **Documentação:** [README](https://github.com/EloisaFazzio/Projeto_AdotaPet/blob/main/README.md), [entrega acadêmica](https://github.com/EloisaFazzio/Projeto_AdotaPet/blob/main/docs/ENTREGA_ACADEMICA_v1.0.0.md) e [triagem das Issues](https://github.com/EloisaFazzio/Projeto_AdotaPet/blob/main/docs/TRIAGEM_ISSUES_ENTREGA.md).
          NOTAS
          if gh release view v1.0.0-academica >/dev/null 2>&1; then
            gh release edit v1.0.0-academica \
              --title "AdotaPet v1.0.0 — Entrega acadêmica" \
              --notes-file /tmp/notas-academicas.md
            echo "Descricao da release academica atualizada."
            exit 0
          fi
          gh release create v1.0.0-academica \
            --target "$GITHUB_SHA" \
            --title "AdotaPet v1.0.0 — Entrega acadêmica" \
            --notes-file /tmp/notas-academicas.md \
            --prerelease
