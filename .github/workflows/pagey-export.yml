name: AdotaPet - pacote ZIP para Pagey
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pagey-export.yml"
      - "site-demo/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do AdotaPet
        uses: actions/checkout@v4
      - name: Empacotar somente o site estatico na raiz do ZIP
        run: |
          cd site-demo
          zip -r ../adotapet-pagey.zip . -x '*.DS_Store'
          cd ..
          unzip -Z1 adotapet-pagey.zip | grep -qx 'index.html'
          unzip -t adotapet-pagey.zip
      - name: Disponibilizar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: adotapet-pagey
          path: adotapet-pagey.zip
          retention-days: 30
