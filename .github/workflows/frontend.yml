name: Frontend — verificação
on:
  push:
    branches: [feat/painel-ong-vacinas-relatorios]
  pull_request:
    branches: [main, feat/frontend-integrado-adotapet]
jobs:
  verificar-interface:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/painel.js
      - name: Conferir arquivos e elementos essenciais da interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          raiz = Path('src/main/resources/static')
          html = (raiz / 'index.html').read_text()
          js = (raiz / 'app.js').read_text()
          css = (raiz / 'styles.css').read_text()
          for id in ['pet-grid', 'filter-form', 'app-dialog', 'btn-account',
                     'btn-requests', 'btn-staff']:
              assert f'id="{id}"' in html, f'Elemento ausente: {id}'
          for endpoint in ['/api/animais', '/api/abrigos', '/api/auth/',
                           '/api/solicitacoes']:
              assert endpoint in js, f'Endpoint não referenciado: {endpoint}'
          assert '--lime' in css and '--deep' in css
          dashboard = (raiz / 'painel.html').read_text()
          dashboard_js = (raiz / 'painel.js').read_text()
          for id in ['panel-content','panel-nav','form-dialog','panel-alert']:
              assert f'id="{id}"' in dashboard, f'ID ausente no painel: {id}'
          for rota in ['vacinas','vacinacoes/vencidas','relatorios/animais-por-status','solicitacoes','usuarios','abrigos']:
              assert rota in dashboard_js, f'Rota não referenciada: {rota}'
          print('Verificação estática da interface concluída')
          PY
