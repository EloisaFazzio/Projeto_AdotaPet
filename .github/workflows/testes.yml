name: Backend Java — testes
on:
  push:
    branches: [main, feat/endpoints-rastreabilidade-openapi]
  pull_request:
    branches: [main, feat/api-catalogo-autenticacao-adocao]
jobs:
  maven-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Executar testes e compilar
        run: mvn --batch-mode --no-transfer-progress test
