name: AdotaPet — homologação full stack
on:
  push:
    branches:
      - feat/integracao-homologacao-adotapet
  pull_request:
    branches:
      - main
jobs:
  homologar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verificar JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/painel.js
      - name: Compilar e executar testes de integração
        run: mvn --batch-mode --no-transfer-progress test
      - name: Subir backend e testar rotas reais HTTP
        shell: bash
        run: |
          set -euo pipefail
          export ADOTAPET_ADMIN_EMAIL="admin-ci@example.invalid"
          export ADOTAPET_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export JWT_SECRET="$(openssl rand -base64 32)"
          mvn --batch-mode -q -DskipTests spring-boot:run > /tmp/adotapet-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://localhost:8080/api/animais; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Processo Java finalizou inesperadamente"
              tail -n 100 /tmp/adotapet-server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Servidor não iniciou no tempo de verificação"
            tail -n 100 /tmp/adotapet-server.log
            exit 1
          fi
          python3 scripts/smoke_fullstack.py
      - name: Mostrar erros do servidor se falhar
        if: failure()
        run: tail -n 120 /tmp/adotapet-server.log 2>/dev/null || true
