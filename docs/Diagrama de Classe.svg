<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>
.bg{fill:#fbf9ff}.box{fill:#fff;stroke:#8064c7;stroke-width:2}.head{fill:#e9e1f8;stroke:#8064c7;stroke-width:2}
.t{font:700 19px Arial,sans-serif;fill:#30234f}.p{font:16px Arial,sans-serif;fill:#342b48}.s{font:13px Arial,sans-serif;fill:#6d5a9b}.l{fill:none;stroke:#8064c7;stroke-width:2}
</style></defs>
<rect class="bg" width="1400" height="900"/>
<text class="t" x="700" y="36" text-anchor="middle" style="font-size:25px">AdotaPet — Diagrama de Classe Simplificado</text>
<text class="s" x="700" y="60" text-anchor="middle">Classes agrupadas por responsabilidade para facilitar a leitura</text>
<!-- relations behind -->
<path class="l" d="M340 170 H410"/><text class="s" x="345" y="157">1</text><text class="s" x="386" y="157">0..*</text><text class="s" x="350" y="145">abriga</text>
<path class="l" d="M740 170 H810"/><text class="s" x="745" y="157">1</text><text class="s" x="785" y="157">0..*</text><text class="s" x="748" y="145">registra</text>
<path class="l" d="M340 535 H410"/><text class="s" x="345" y="522">1</text><text class="s" x="385" y="522">0..*</text><text class="s" x="350" y="510">solicita</text>
<path class="l" d="M740 535 H810"/><text class="s" x="745" y="522">1</text><text class="s" x="785" y="522">0..*</text><text class="s" x="748" y="510">acompanha</text>
<path class="l" d="M575 300 V405"/><text class="s" x="585" y="320">1</text><text class="s" x="585" y="395">0..*</text><text class="s" x="590" y="360">animal</text>
<!-- Abrigo -->
<rect class="box" x="40" y="90" width="300" height="210" rx="3"/><rect class="head" x="40" y="90" width="300" height="40"/>
<text class="t" x="190" y="116" text-anchor="middle">Abrigo</text>
<text class="p" x="58" y="158">id: Long</text><text class="p" x="58" y="184">nome: String</text><text class="p" x="58" y="210">cidade: String</text><text class="p" x="58" y="236">telefone: String</text><text class="p" x="58" y="262">capacidade: int</text>
<!-- Animal -->
<rect class="box" x="410" y="90" width="330" height="210" rx="3"/><rect class="head" x="410" y="90" width="330" height="40"/>
<text class="t" x="575" y="116" text-anchor="middle">Animal</text>
<text class="p" x="428" y="158">id: Long</text><text class="p" x="428" y="184">nome: String</text><text class="p" x="428" y="210">espécie e porte</text><text class="p" x="428" y="236">dataNascimento: LocalDate</text><text class="p" x="428" y="262">status: StatusAnimal</text>
<!-- Saúde animal combined -->
<rect class="box" x="810" y="90" width="520" height="210" rx="3"/><rect class="head" x="810" y="90" width="520" height="40"/>
<text class="t" x="1070" y="116" text-anchor="middle">Vacinação do Animal</text>
<text class="p" x="830" y="158">vacina: nome e espécie-alvo</text><text class="p" x="830" y="184">dataAplicacao: LocalDate</text><text class="p" x="830" y="210">proximaDose: LocalDate</text><text class="p" x="830" y="236">veterinario: String</text><text class="s" x="830" y="270">Agrupa os dados da vacina e o registro de aplicação</text>
<!-- User -->
<rect class="box" x="40" y="405" width="300" height="260" rx="3"/><rect class="head" x="40" y="405" width="300" height="40"/>
<text class="t" x="190" y="431" text-anchor="middle">Usuário</text>
<text class="p" x="58" y="473">id: Long</text><text class="p" x="58" y="499">nome: String</text><text class="p" x="58" y="525">email: String</text><text class="p" x="58" y="551">perfil: Perfil</text><text class="p" x="58" y="577">ativo: boolean</text><text class="s" x="58" y="615">Adotante, voluntário ou administrador</text>
<!-- Adoption process combined -->
<rect class="box" x="410" y="405" width="330" height="260" rx="3"/><rect class="head" x="410" y="405" width="330" height="40"/>
<text class="t" x="575" y="431" text-anchor="middle">Processo de Adoção</text>
<text class="p" x="428" y="473">id: Long</text><text class="p" x="428" y="499">justificativa: String</text><text class="p" x="428" y="525">parecer: String</text><text class="p" x="428" y="551">status: StatusSolicitacao</text><text class="p" x="428" y="577">dataAdocao: LocalDate</text><text class="p" x="428" y="603">termoAssinado: boolean</text><text class="s" x="428" y="635">Reúne solicitação e formalização da adoção</text>
<!-- Follow-up -->
<rect class="box" x="810" y="405" width="520" height="260" rx="3"/><rect class="head" x="810" y="405" width="520" height="40"/>
<text class="t" x="1070" y="431" text-anchor="middle">Acompanhamento Pós-Adoção</text>
<text class="p" x="830" y="473">dataVisita: LocalDate</text><text class="p" x="830" y="499">observacoes: String</text><text class="p" x="830" y="525">animalBemCuidado: boolean</text><text class="p" x="830" y="551">voluntário responsável</text><text class="s" x="830" y="595">Registra visitas e verifica o bem-estar do animal</text>
<!-- enum row -->
<text class="t" x="40" y="730">Valores de referência</text>
<rect class="box" x="40" y="750" width="400" height="95"/><text class="t" x="60" y="777">Perfil</text><text class="p" x="60" y="806">ADMIN · VOLUNTARIO · ADOTANTE</text>
<rect class="box" x="460" y="750" width="400" height="95"/><text class="t" x="480" y="777">Status do animal</text><text class="p" x="480" y="806">DISPONIVEL · EM_TRATAMENTO · ADOTADO</text>
<rect class="box" x="880" y="750" width="450" height="95"/><text class="t" x="900" y="777">Status da solicitação</text><text class="p" x="900" y="806">PENDENTE · EM_ANALISE · APROVADA · REJEITADA</text>
<text class="s" x="700" y="880" text-anchor="middle">Visão conceitual resumida. Classes agrupadas no desenho podem continuar separadas na implementação.</text>
</svg>