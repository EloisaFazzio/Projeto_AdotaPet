<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <style>
    .bg{fill:#fbf9ff}.box{fill:#fff;stroke:#8064c7;stroke-width:2}.head{fill:#e9e1f8;stroke:#8064c7;stroke-width:2}
    .title{font:700 18px Arial,sans-serif;fill:#30234f}.txt{font:15px Arial,sans-serif;fill:#342b48}
    .small{font:13px Arial,sans-serif;fill:#4e4564}.line{fill:none;stroke:#8064c7;stroke-width:2}
    .label{font:italic 13px Arial,sans-serif;fill:#6d5a9b}.multi{font:13px Arial,sans-serif;fill:#30234f}
  </style>
</defs>
<rect class="bg" width="1600" height="1120"/>
<text x="800" y="32" text-anchor="middle" class="title" style="font-size:24px">AdotaPet — Diagrama de Classe (versão simplificada)</text>

<!-- Relationships behind the classes -->
<path class="line" d="M330 135 H410"/>
<text class="multi" x="338" y="124">1</text><text class="multi" x="390" y="124">0..*</text><text class="label" x="350" y="115">abriga</text>

<path class="line" d="M750 135 H810"/>
<text class="multi" x="755" y="124">1</text><text class="multi" x="785" y="124">0..*</text><text class="label" x="756" y="115">histórico</text>

<path class="line" d="M1110 135 H1170"/>
<text class="multi" x="1115" y="124">0..*</text><text class="multi" x="1145" y="124">1</text><text class="label" x="1118" y="115">usa</text>

<!-- Animal to request -->
<path class="line" d="M580 310 V455"/>
<text class="multi" x="590" y="330">1</text><text class="multi" x="590" y="445">0..*</text><text class="label" x="592" y="390">alvo de</text>

<!-- User to shelter volunteers: routed around left -->
<path class="line" d="M170 250 V390 H45 V495 H170"/>
<text class="multi" x="178" y="270">0..*</text><text class="multi" x="178" y="485">0..*</text><text class="label" x="53" y="380">voluntários</text>

<!-- User requests -->
<path class="line" d="M330 555 H410"/>
<text class="multi" x="337" y="544">1</text><text class="multi" x="390" y="544">0..*</text><text class="label" x="350" y="535">solicita</text>

<!-- User analyzes requests -->
<path class="line" d="M330 635 H410"/>
<text class="multi" x="337" y="624">0..1</text><text class="multi" x="385" y="624">0..*</text><text class="label" x="343" y="615">analisa</text>

<!-- Request formalizes adoption -->
<path class="line" d="M750 555 H810"/>
<text class="multi" x="755" y="544">1</text><text class="multi" x="785" y="544">0..1</text><text class="label" x="754" y="535">formaliza</text>

<!-- Adoption follow-ups -->
<path class="line" d="M1110 555 H1170"/>
<text class="multi" x="1115" y="544">1</text><text class="multi" x="1145" y="544">0..*</text><text class="label" x="1113" y="535">acompanhada</text>

<!-- Volunteer records visits -->
<path class="line" d="M270 735 V800 H1320 V615"/>
<text class="multi" x="280" y="755">1</text><text class="multi" x="1330" y="635">0..*</text><text class="label" x="730" y="790">voluntário realiza visitas</text>

<!-- Abrigo -->
<rect class="box" x="30" y="70" width="300" height="180" rx="3"/><rect class="head" x="30" y="70" width="300" height="38"/>
<text class="title" x="180" y="95" text-anchor="middle">Abrigo</text>
<text class="txt" x="45" y="130">id: Long</text><text class="txt" x="45" y="153">nome: String</text><text class="txt" x="45" y="176">cidade: String</text><text class="txt" x="45" y="199">capacidade: int</text><text class="txt" x="45" y="222">telefone: String</text>

<!-- Animal -->
<rect class="box" x="410" y="70" width="340" height="240" rx="3"/><rect class="head" x="410" y="70" width="340" height="38"/>
<text class="title" x="580" y="95" text-anchor="middle">Animal</text>
<text class="txt" x="425" y="130">id: Long</text><text class="txt" x="425" y="153">nome: String</text><text class="txt" x="425" y="176">especie: Especie</text><text class="txt" x="425" y="199">porte: Porte</text><text class="txt" x="425" y="222">status: StatusAnimal</text><text class="txt" x="425" y="245">dataNascimento: LocalDate</text><text class="txt" x="425" y="268">abrigo: Abrigo</text><text class="small" x="425" y="292">Métodos de estado omitidos para simplificar</text>

<!-- Vaccination history -->
<rect class="box" x="810" y="70" width="300" height="180" rx="3"/><rect class="head" x="810" y="70" width="300" height="38"/>
<text class="title" x="960" y="95" text-anchor="middle">VacinacaoAnimal</text>
<text class="txt" x="825" y="130">id: Long</text><text class="txt" x="825" y="153">dataAplicacao: LocalDate</text><text class="txt" x="825" y="176">proximaDose: LocalDate</text><text class="txt" x="825" y="199">veterinario: String</text><text class="small" x="825" y="226">Registra a vacina aplicada ao animal</text>

<!-- Vaccine -->
<rect class="box" x="1170" y="70" width="400" height="180" rx="3"/><rect class="head" x="1170" y="70" width="400" height="38"/>
<text class="title" x="1370" y="95" text-anchor="middle">Vacina</text>
<text class="txt" x="1185" y="130">id: Long</text><text class="txt" x="1185" y="153">nome: String</text><text class="txt" x="1185" y="176">especieAlvo: Especie</text><text class="txt" x="1185" y="199">intervaloDias: Integer</text><text class="small" x="1185" y="226">Define intervalo para próxima dose</text>

<!-- User -->
<rect class="box" x="30" y="495" width="300" height="240" rx="3"/><rect class="head" x="30" y="495" width="300" height="38"/>
<text class="title" x="180" y="520" text-anchor="middle">Usuario</text>
<text class="txt" x="45" y="555">id: Long</text><text class="txt" x="45" y="578">nome: String</text><text class="txt" x="45" y="601">email: String</text><text class="txt" x="45" y="624">perfil: Perfil</text><text class="txt" x="45" y="647">ativo: boolean</text><text class="small" x="45" y="682">Pode atuar como adotante ou voluntário</text><text class="small" x="45" y="705">conforme o perfil autorizado.</text>

<!-- Adoption request -->
<rect class="box" x="410" y="455" width="340" height="250" rx="3"/><rect class="head" x="410" y="455" width="340" height="38"/>
<text class="title" x="580" y="480" text-anchor="middle">SolicitacaoAdocao</text>
<text class="txt" x="425" y="515">id: Long</text><text class="txt" x="425" y="538">justificativa: String</text><text class="txt" x="425" y="561">parecer: String</text><text class="txt" x="425" y="584">status: StatusSolicitacao</text><text class="txt" x="425" y="607">solicitadaEm: LocalDateTime</text><text class="small" x="425" y="650">Vincula adotante, animal e analista</text><text class="small" x="425" y="673">da solicitação.</text>

<!-- Adoption -->
<rect class="box" x="810" y="455" width="300" height="180" rx="3"/><rect class="head" x="810" y="455" width="300" height="38"/>
<text class="title" x="960" y="480" text-anchor="middle">Adocao</text>
<text class="txt" x="825" y="515">id: Long</text><text class="txt" x="825" y="538">dataAdocao: LocalDate</text><text class="txt" x="825" y="561">termoAssinado: boolean</text><text class="txt" x="825" y="584">observacoes: String</text><text class="small" x="825" y="615">Formaliza uma solicitação aprovada</text>

<!-- Visit -->
<rect class="box" x="1170" y="455" width="400" height="160" rx="3"/><rect class="head" x="1170" y="455" width="400" height="38"/>
<text class="title" x="1370" y="480" text-anchor="middle">VisitaAcompanhamento</text>
<text class="txt" x="1185" y="515">id: Long</text><text class="txt" x="1185" y="538">dataVisita: LocalDate</text><text class="txt" x="1185" y="561">observacoes: String</text><text class="txt" x="1185" y="584">animalBemCuidado: boolean</text>

<!-- Enums -->
<text class="title" x="30" y="870" style="font-size:19px">Enumerações principais</text>
<rect class="box" x="30" y="890" width="230" height="160"/><rect class="head" x="30" y="890" width="230" height="34"/><text class="title" x="145" y="913" text-anchor="middle">Perfil</text>
<text class="txt" x="45" y="948">ADMIN</text><text class="txt" x="45" y="971">VOLUNTARIO</text><text class="txt" x="45" y="994">ADOTANTE</text>
<rect class="box" x="280" y="890" width="230" height="160"/><rect class="head" x="280" y="890" width="230" height="34"/><text class="title" x="395" y="913" text-anchor="middle">Especie</text>
<text class="txt" x="295" y="948">CAO</text><text class="txt" x="295" y="971">GATO</text><text class="txt" x="295" y="994">OUTRA</text>
<rect class="box" x="530" y="890" width="230" height="160"/><rect class="head" x="530" y="890" width="230" height="34"/><text class="title" x="645" y="913" text-anchor="middle">Porte</text>
<text class="txt" x="545" y="948">PEQUENO</text><text class="txt" x="545" y="971">MEDIO</text><text class="txt" x="545" y="994">GRANDE</text>
<rect class="box" x="780" y="890" width="330" height="160"/><rect class="head" x="780" y="890" width="330" height="34"/><text class="title" x="945" y="913" text-anchor="middle">StatusAnimal</text>
<text class="txt" x="795" y="948">DISPONIVEL · EM_TRATAMENTO</text><text class="txt" x="795" y="971">EM_PROCESSO_ADOCAO</text><text class="txt" x="795" y="994">ADOTADO</text>
<rect class="box" x="1130" y="890" width="440" height="160"/><rect class="head" x="1130" y="890" width="440" height="34"/><text class="title" x="1350" y="913" text-anchor="middle">StatusSolicitacao</text>
<text class="txt" x="1145" y="948">PENDENTE · EM_ANALISE · APROVADA</text><text class="txt" x="1145" y="971">REJEITADA · CANCELADA</text>
<text class="small" x="800" y="1090" text-anchor="middle">Versão resumida: atributos e operações secundárias foram omitidos para facilitar a leitura.</text>
</svg>