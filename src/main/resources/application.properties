spring.application.name=adotapet

# Hospedagens gerenciadas podem definir PORT; local e Docker Compose continuam em 8080.
server.port=${PORT:8080}

# Banco de dados (PostgreSQL / Supabase). Configure por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:h2:mem:adotapet;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
